name: Build macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    # macos-13 was retired by GitHub. This is the supported Intel runner.
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      # The release must be runnable on macOS 13.7.8 and later.
      MACOSX_DEPLOYMENT_TARGET: '13.7'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Show runner and Apple toolchain
        run: |
          uname -m
          sw_vers
          xcodebuild -version

      - name: Generate macOS platform files
        run: flutter create --platforms=macos .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/serial_terminal.app serial-terminal-macos-intel.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-terminal-macos-intel
          path: serial-terminal-macos-intel.zip
          if-no-files-found: error
