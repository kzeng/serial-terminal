name: Build Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # ubuntu-22.04 is an amd64 GitHub-hosted runner.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.29.3
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            automake \
            autoconf \
            libtool

      - name: Verify runner architecture
        run: test "$(uname -m)" = "x86_64"

      - name: Enable Linux desktop support
        run: flutter config --enable-linux-desktop

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Linux platform files
        run: flutter create --platforms=linux .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release

      - name: Package Linux artifact
        run: tar -czf serial-terminal-linux-amd64.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-terminal-linux-amd64
          path: serial-terminal-linux-amd64.tar.gz
          if-no-files-found: error
